[project]
name = "incubyte-backend"
version = "0.1.0"
description = "Car Dealership Inventory System backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "pymongo==4.9.1",
    "pwdlib[argon2]==0.3.1",
    "PyJWT==2.9.0",
    "python-multipart==0.0.12",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
    "httpx==0.27.2",
    "ruff==0.6.8",
    "black==24.8.0",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]